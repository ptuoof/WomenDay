<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bức Thư 3D Chúc Mừng 20/10 · Women's Day</title>
  <meta name="description" content="Tấm thiệp 3D lãng mạn phong cách đất nặn dễ thương chúc mừng ngày Phụ nữ Việt Nam 20/10.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
  
  <style>
    :root {
      --bg-start: #fff3f6;
      --bg-end: #fcd5e0;
      --primary: #e0537a;
      --primary-dark: #b82d54;
      --ink: #4a2835;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at 50% 45%, var(--bg-start) 0%, var(--bg-end) 100%);
    }

    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* UI Overlay */
    .ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 24px) env(safe-area-inset-left, 20px);
    }

    .header-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(225, 175, 190, 0.5);
      border-radius: 20px;
      text-decoration: none;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 4px 12px rgba(184, 45, 84, 0.08);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 16px rgba(184, 45, 84, 0.15);
    }
    .nav-btn:active {
      transform: scale(0.96);
    }

    .title-pill {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
      background: rgba(255, 240, 245, 0.82);
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid rgba(240, 180, 195, 0.6);
      backdrop-filter: blur(8px);
      letter-spacing: 0.5px;
    }

    /* Bottom Prompt & Controls */
    .bottom-area {
      pointer-events: auto;
      text-align: center;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .tap-hint {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(230, 160, 180, 0.6);
      border-radius: 30px;
      color: var(--ink);
      font-size: 14.5px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(180, 50, 90, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: pulse-hint 2.4s ease-in-out infinite;
      cursor: pointer;
    }
    .tap-hint span.icon {
      color: var(--primary);
      font-size: 16px;
      animation: heart-bounce 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulse-hint {
      0%, 100% { transform: translateY(0); box-shadow: 0 6px 20px rgba(180, 50, 90, 0.12); }
      50% { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(180, 50, 90, 0.22); }
    }
    @keyframes heart-bounce {
      from { transform: scale(0.9); }
      to { transform: scale(1.25); }
    }

    .actions-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .primary-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #e45880 0%, #ba2952 100%);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      border: none;
      border-radius: 26px;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(186, 41, 82, 0.35);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .primary-action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(186, 41, 82, 0.45);
    }
    .primary-action-btn:active {
      transform: scale(0.96);
    }

    /* Modal Card Details when opened */
    .opened-card-controls {
      display: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .opened-card-controls.visible {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    /* Touch Drag Instruction */
    .drag-instruction {
      font-size: 12px;
      color: rgba(90, 50, 65, 0.65);
      font-style: italic;
    }
  </style>

  <!-- Three.js and GSAP via official CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <div class="ui-overlay">
    <header class="header-bar">
      <a href="./index.html" class="nav-btn" aria-label="Quay lại Bó hoa">
        <span aria-hidden="true">❮</span> Bó hoa
      </a>
      <span class="title-pill">20 · 10 ♡ 3D Cute Mail</span>
      <a href="./garden.html" class="nav-btn" aria-label="Đến Vườn hoa thứ 2">
        Vườn hoa <span aria-hidden="true">❯</span>
      </a>
    </header>

    <div class="bottom-area">
      <div id="closedPrompt" class="tap-hint" role="button" tabindex="0" aria-label="Chạm vào thư để mở">
        <span class="icon">♡</span>
        <span>Chạm vào thư để mở lời chúc 20/10</span>
        <span class="icon">✨</span>
      </div>

      <div id="openedControls" class="opened-card-controls actions-box">
        <a href="./garden.html" class="primary-action-btn">
          <span>Bước vào Vườn Hoa thứ 2 ❀</span>
        </a>
        <button id="toggleMailBtn" class="nav-btn" type="button">
          Đóng thư lại ✕
        </button>
      </div>

      <p class="drag-instruction">✦ Xoay hoặc rê chuột để ngắm thư 3D đa chiều ✦</p>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // 1. Scene, Camera, Renderer
      const container = document.getElementById('webgl-container');
      const scene = new THREE.Scene();
      
      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 8.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      // 2. Soft Studio Lighting (Claymorphic / Soft Silicone Aesthetic)
      const ambientLight = new THREE.AmbientLight(0xfff5f8, 0.7);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 0.85);
      mainLight.position.set(4, 7, 5);
      scene.add(mainLight);

      const pinkFillLight = new THREE.PointLight(0xffa3bb, 0.6, 20);
      pinkFillLight.position.set(-4, -2, 4);
      scene.add(pinkFillLight);

      const rimLight = new THREE.DirectionalLight(0xffe6ee, 0.4);
      rimLight.position.set(0, 4, -4);
      scene.add(rimLight);

      // Root Mail Group
      const mailGroup = new THREE.Group();
      // Slight default 3D isometric tilt matching the reference image
      mailGroup.rotation.set(0.24, -0.28, 0.22);
      scene.add(mailGroup);

      // 3. Materials (Silky Claymorphism Pink)
      const outerPinkMat = new THREE.MeshPhysicalMaterial({
        color: 0xff668c,
        roughness: 0.32,
        metalness: 0.02,
        clearcoat: 0.35,
        clearcoatRoughness: 0.2
      });

      const creasePinkMat = new THREE.MeshPhysicalMaterial({
        color: 0xee557b,
        roughness: 0.4,
        metalness: 0.02,
        clearcoat: 0.15
      });

      const heartSealMat = new THREE.MeshPhysicalMaterial({
        color: 0xff1a53,
        roughness: 0.2,
        metalness: 0.08,
        clearcoat: 0.6,
        clearcoatRoughness: 0.12
      });

      // Helper: Generate Rounded Extrude Geometry
      function createRoundedRectShape(w, h, r) {
        const shape = new THREE.Shape();
        const x = -w / 2, y = -h / 2;
        shape.moveTo(x + r, y);
        shape.lineTo(x + w - r, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + r);
        shape.lineTo(x + w, y + h - r);
        shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        shape.lineTo(x + r, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
        return shape;
      }

      // --- A. Thân Bao Thư (Puffy Back Body) ---
      const bodyShape = createRoundedRectShape(3.4, 2.3, 0.4);
      const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, {
        depth: 0.32,
        bevelEnabled: true,
        bevelSegments: 7,
        steps: 1,
        bevelSize: 0.14,
        bevelThickness: 0.14
      });
      const bodyMesh = new THREE.Mesh(bodyGeo, outerPinkMat);
      bodyMesh.position.set(0, 0, -0.2);
      mailGroup.add(bodyMesh);

      // --- B. Nếp Gấp Mặt Trước (Diagonal Crease Seams matching Reference Image) ---
      // Tạo 2 nếp gấp chéo từ góc dưới lên tâm để tạo đường may chân thực như ảnh mẫu
      const creaseGroup = new THREE.Group();
      creaseGroup.position.set(0, 0, 0.13);
      mailGroup.add(creaseGroup);

      function createFoldFlapShape(isLeft) {
        const shape = new THREE.Shape();
        const w = 1.62, h = 1.1;
        if (isLeft) {
          shape.moveTo(-1.62, -1.05);
          shape.lineTo(0, -0.05);
          shape.lineTo(-1.62, 0.85);
          shape.quadraticCurveTo(-1.68, 0, -1.62, -1.05);
        } else {
          shape.moveTo(1.62, -1.05);
          shape.lineTo(0, -0.05);
          shape.lineTo(1.62, 0.85);
          shape.quadraticCurveTo(1.68, 0, 1.62, -1.05);
        }
        return shape;
      }

      const foldGeoSettings = { depth: 0.04, bevelEnabled: true, bevelSegments: 4, bevelSize: 0.04, bevelThickness: 0.04 };
      const leftFoldMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(createFoldFlapShape(true), foldGeoSettings), creasePinkMat);
      const rightFoldMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(createFoldFlapShape(false), foldGeoSettings), creasePinkMat);
      creaseGroup.add(leftFoldMesh, rightFoldMesh);

      // Nếp gấp đáy tam giác
      const bottomShape = new THREE.Shape();
      bottomShape.moveTo(-1.58, -1.08);
      bottomShape.quadraticCurveTo(-0.8, -1.14, 0, -1.14);
      bottomShape.quadraticCurveTo(0.8, -1.14, 1.58, -1.08);
      bottomShape.lineTo(0, -0.12);
      bottomShape.closePath();
      const bottomFoldMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(bottomShape, foldGeoSettings), outerPinkMat);
      creaseGroup.add(bottomFoldMesh);

      // --- C. Tấm Thiệp Lời Chúc Bên Trong (Inner Letter with Dynamic Canvas Texture) ---
      const letterCanvas = document.createElement('canvas');
      letterCanvas.width = 1024;
      letterCanvas.height = 768;
      const lCtx = letterCanvas.getContext('2d');

      function updateLetterTexture(recipientName, messageText) {
        lCtx.fillStyle = '#fffcfd';
        lCtx.fillRect(0, 0, 1024, 768);

        // Delicate decorative border
        lCtx.strokeStyle = '#f3c7d3';
        lCtx.lineWidth = 10;
        lCtx.strokeRect(36, 36, 1024 - 72, 768 - 72);
        lCtx.strokeStyle = '#e79cb2';
        lCtx.lineWidth = 2.5;
        lCtx.strokeRect(48, 48, 1024 - 96, 768 - 96);

        // Golden floral corner accents
        lCtx.font = '32px sans-serif';
        lCtx.fillStyle = '#d47894';
        lCtx.fillText('❀', 65, 95);
        lCtx.fillText('❀', 1024 - 98, 95);
        lCtx.fillText('❀', 65, 768 - 65);
        lCtx.fillText('❀', 1024 - 98, 768 - 65);

        // Header: 20 · 10
        lCtx.textAlign = 'center';
        lCtx.font = 'bold 54px Georgia, serif';
        lCtx.fillStyle = '#b32d54';
        lCtx.fillText('20 · 10', 512, 130);

        lCtx.font = 'italic 26px Georgia, serif';
        lCtx.fillStyle = '#8c5064';
        lCtx.fillText('Chúc Mừng Ngày Phụ Nữ Việt Nam', 512, 180);

        // Dividing line
        lCtx.strokeStyle = '#eeb3c4';
        lCtx.lineWidth = 2;
        lCtx.beginPath();
        lCtx.moveTo(340, 210);
        lCtx.lineTo(684, 210);
        lCtx.stroke();

        // Recipient
        lCtx.font = 'bold 36px -apple-system, sans-serif';
        lCtx.fillStyle = '#4a2533';
        lCtx.fillText('Gửi ' + (recipientName || 'Bạn') + ' thân yêu,', 512, 280);

        // Message
        lCtx.font = 'italic 29px Georgia, serif';
        lCtx.fillStyle = '#593242';
        const lines = [
          'Chúc bạn một ngày ngập tràn niềm vui và sự dịu dàng.',
          'Mong bạn luôn an yên, tự tin vào chính mình,',
          'và luôn được trân quý, yêu thương trong từng khoảnh khắc.',
          'Hôm nay và mãi mãi, hãy luôn rạng ngời theo cách riêng của bạn nhé!'
        ];
        lines.forEach((line, idx) => {
          lCtx.fillText(line, 512, 355 + idx * 56);
        });

        // Signoff
        lCtx.font = 'bold 30px Georgia, serif';
        lCtx.fillStyle = '#b32d54';
        lCtx.fillText('Với thật nhiều yêu thương ♡', 512, 640);
      }

      // Check localStorage if user customized greeting
      let customRecipient = 'Bạn';
      try {
        const saved = JSON.parse(localStorage.getItem('flower.greeting.20-10.v1'));
        if (saved && saved.recipient) customRecipient = saved.recipient;
      } catch (_) {}
      updateLetterTexture(customRecipient);

      const letterTex = new THREE.CanvasTexture(letterCanvas);
      letterTex.generateMipmaps = true;
      letterTex.minFilter = THREE.LinearMipmapLinearFilter;

      const cardGroup = new THREE.Group();
      cardGroup.position.set(0, 0, 0.04);
      mailGroup.add(cardGroup);

      const cardGeo = new THREE.BoxGeometry(3.05, 2.15, 0.04);
      const cardMat = new THREE.MeshStandardMaterial({
        map: letterTex,
        roughness: 0.35,
        metalness: 0.05
      });
      const cardMesh = new THREE.Mesh(cardGeo, cardMat);
      cardGroup.add(cardMesh);

      // --- D. Nắp Thư Tam Giác Bo Góc Puffy (Flap with Top Pivot Hinge) ---
      // Xây dựng hình dáng nắp thư y hệt ảnh reference: tam giác úp, đỉnh bo tròn mềm mại
      const flapShape = new THREE.Shape();
      const fw = 3.32, fh = 1.48, fr = 0.3, tipR = 0.38;
      
      flapShape.moveTo(-fw / 2 + fr, 0);
      flapShape.lineTo(fw / 2 - fr, 0);
      flapShape.quadraticCurveTo(fw / 2, 0, fw / 2, -fr);
      flapShape.lineTo(tipR * 0.9, -fh + tipR * 0.6);
      flapShape.quadraticCurveTo(0, -fh, -tipR * 0.9, -fh + tipR * 0.6);
      flapShape.lineTo(-fw / 2, -fr);
      flapShape.quadraticCurveTo(-fw / 2, 0, -fw / 2 + fr, 0);

      const flapGeo = new THREE.ExtrudeGeometry(flapShape, {
        depth: 0.12,
        bevelEnabled: true,
        bevelSegments: 8,
        steps: 1,
        bevelSize: 0.11,
        bevelThickness: 0.11
      });

      // Flap Pivot Group đặt tại trục bản lề phía trên nắp
      const flapPivot = new THREE.Group();
      flapPivot.position.set(0, 1.15, 0.22);
      mailGroup.add(flapPivot);

      const flapMesh = new THREE.Mesh(flapGeo, outerPinkMat);
      flapMesh.position.set(0, 0, 0);
      flapPivot.add(flapMesh);

      // --- E. Con Dấu Sáp Trái Tim Dễ Thương ---
      const heartShape = new THREE.Shape();
      heartShape.moveTo(0, 0);
      heartShape.bezierCurveTo(0, 0.3, -0.42, 0.62, -0.72, 0.3);
      heartShape.bezierCurveTo(-1.02, 0, -0.72, -0.52, 0, -0.92);
      heartShape.bezierCurveTo(0.72, -0.52, 1.02, 0, 0.72, 0.3);
      heartShape.bezierCurveTo(0.42, 0.62, 0, 0.3, 0, 0);

      const heartGeo = new THREE.ExtrudeGeometry(heartShape, {
        depth: 0.1,
        bevelEnabled: true,
        bevelSegments: 5,
        bevelSize: 0.04,
        bevelThickness: 0.04
      });
      const heartMesh = new THREE.Mesh(heartGeo, heartSealMat);
      heartMesh.scale.set(0.42, 0.42, 0.42);
      heartMesh.position.set(0, -1.40, 0.26);
      flapPivot.add(heartMesh);

      // --- F. Các Trái Tim & Cánh Hoa Nhỏ Bay Xung Quanh ---
      const particlesGroup = new THREE.Group();
      const heartParticles = [];
      const particleColors = [0xff7597, 0xff9eb7, 0xffb8cb, 0xff4f78];

      for (let i = 0; i < 18; i++) {
        const mat = new THREE.MeshStandardMaterial({
          color: particleColors[i % particleColors.length],
          roughness: 0.3,
          metalness: 0.05
        });
        const pMesh = new THREE.Mesh(heartGeo, mat);
        const s = 0.09 + Math.random() * 0.16;
        pMesh.scale.set(s, s, s);
        
        const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.5;
        const radius = 2.6 + Math.random() * 2.2;
        pMesh.position.set(
          Math.cos(angle) * radius,
          Math.sin(angle) * radius * 0.85 + (Math.random() - 0.5) * 1.5,
          (Math.random() - 0.5) * 3
        );
        pMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
        
        heartParticles.push({
          mesh: pMesh,
          speedY: 0.003 + Math.random() * 0.004,
          rotSpeed: 0.008 + Math.random() * 0.015,
          baseY: pMesh.position.y,
          offset: Math.random() * Math.PI * 2
        });
        particlesGroup.add(pMesh);
      }
      scene.add(particlesGroup);

      // --- G. Nổ Pháo Hoa Trái Tim khi Mở Thư (Interactive Burst Particles) ---
      const burstGroup = new THREE.Group();
      scene.add(burstGroup);
      const burstMeshes = [];

      function triggerHeartExplosion() {
        for (let i = 0; i < 36; i++) {
          const mat = new THREE.MeshPhysicalMaterial({
            color: particleColors[i % particleColors.length],
            roughness: 0.25,
            clearcoat: 0.5
          });
          const bMesh = new THREE.Mesh(heartGeo, mat);
          const s = 0.08 + Math.random() * 0.16;
          bMesh.scale.set(s, s, s);
          bMesh.position.set(0, 0.4, 0.5);
          burstGroup.add(bMesh);

          const theta = Math.random() * Math.PI * 2;
          const phi = (Math.random() - 0.5) * Math.PI;
          const speed = 3.2 + Math.random() * 3.8;
          const targetX = Math.cos(theta) * Math.cos(phi) * speed;
          const targetY = (Math.sin(phi) + 0.6) * speed;
          const targetZ = Math.sin(theta) * Math.cos(phi) * speed;

          gsap.to(bMesh.position, {
            x: targetX,
            y: targetY,
            z: targetZ,
            duration: 1.4 + Math.random() * 0.6,
            ease: 'power2.out'
          });

          gsap.to(bMesh.rotation, {
            x: Math.random() * 12,
            y: Math.random() * 12,
            z: Math.random() * 12,
            duration: 1.8,
            ease: 'power1.out'
          });

          gsap.to(bMesh.scale, {
            x: 0.001,
            y: 0.001,
            z: 0.001,
            delay: 1.0 + Math.random() * 0.5,
            duration: 0.6,
            ease: 'power2.in',
            onComplete: () => {
              burstGroup.remove(bMesh);
              bMesh.geometry.dispose();
              bMesh.material.dispose();
            }
          });
        }
      }

      // --- 4. Interactive State & GSAP Open / Close Animation ---
      let isMailOpen = false;
      let isAnimating = false;

      const closedPrompt = document.getElementById('closedPrompt');
      const openedControls = document.getElementById('openedControls');
      const toggleMailBtn = document.getElementById('toggleMailBtn');

      
      // Soft Sparkle Chime Sound via Web Audio API (Zero external assets)
      function playSparkleSound() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51]; // C5, E5, G5, C6, E6
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.055);

            gain.gain.setValueAtTime(0, ctx.currentTime + idx * 0.055);
            gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + idx * 0.055 + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.055 + 0.65);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + idx * 0.055);
            osc.stop(ctx.currentTime + idx * 0.055 + 0.7);
          });
        } catch (_) {}
      }

      function playHaptic() {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate(20); } catch (_) {}
        }
      }

      function setMailOpen(open) {
        if (isAnimating || isMailOpen === open) return;
        isAnimating = true;
        isMailOpen = open;
        playHaptic();

        if (open) {
          playSparkleSound();
          closedPrompt.style.display = 'none';
          openedControls.classList.add('visible');
          triggerHeartExplosion();

          // 1. Thư hơi co nhẹ lấy đà rồi nảy ra
          gsap.timeline()
            .to(mailGroup.scale, { x: 1.08, y: 0.94, z: 1.06, duration: 0.22, ease: 'power2.out' })
            .to(mailGroup.scale, { x: 1.0, y: 1.0, z: 1.0, duration: 0.35, ease: 'back.out(2)' });

          // 2. Nắp thư lật mở lên trên và ra sau
          gsap.to(flapPivot.rotation, {
            x: -Math.PI * 0.88,
            duration: 0.85,
            ease: 'power3.inOut'
          });

          // 3. Tấm thiệp nhô cao lên khỏi bao thư
          gsap.to(cardGroup.position, {
            y: 1.45,
            z: 0.35,
            duration: 0.95,
            delay: 0.25,
            ease: 'power3.out'
          });

          // 4. Xoay góc thư nhìn chính diện hơn để đọc rõ chữ
          gsap.to(mailGroup.rotation, {
            x: 0.04,
            y: 0.02,
            z: 0.0,
            duration: 0.8,
            ease: 'power2.out',
            onComplete: () => {
              isAnimating = false;
              openedControls.classList.add('visible');
            }
          });

        } else {
          openedControls.classList.remove('visible');

          // Đóng thiệp thụt xuống
          gsap.to(cardGroup.position, {
            y: 0,
            z: 0.04,
            duration: 0.6,
            ease: 'power2.inOut'
          });

          // Đóng nắp thư
          gsap.to(flapPivot.rotation, {
            x: 0,
            duration: 0.75,
            delay: 0.35,
            ease: 'back.out(1.5)',
            onComplete: () => {
              isAnimating = false;
              closedPrompt.style.display = 'inline-flex';
              // Trả về góc isometric đáng yêu
              gsap.to(mailGroup.rotation, {
                x: 0.24,
                y: -0.28,
                z: 0.22,
                duration: 0.7,
                ease: 'power2.out'
              });
            }
          });
        }
      }

      // Click / Tap Handler
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      function onPointerTrigger(clientX, clientY) {
        mouse.x = (clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(mailGroup.children, true);
        if (intersects.length > 0) {
          setMailOpen(!isMailOpen);
        }
      }

      window.addEventListener('click', (e) => {
        // Tránh click nhầm UI buttons
        if (e.target.closest('.ui-overlay') && !e.target.closest('#closedPrompt')) return;
        onPointerTrigger(e.clientX, e.clientY);
      });

      closedPrompt.addEventListener('click', () => setMailOpen(true));
      toggleMailBtn.addEventListener('click', () => setMailOpen(false));

      // --- 5. Mouse Parallax & Touch Interaction ---
      let targetRotX = 0.24;
      let targetRotY = -0.28;
      let isDragging = false;
      let prevPointerX = 0;
      let prevPointerY = 0;

      window.addEventListener('mousemove', (e) => {
        if (isMailOpen) return;
        const normX = (e.clientX / window.innerWidth - 0.5) * 0.7;
        const normY = (e.clientY / window.innerHeight - 0.5) * 0.5;
        targetRotY = -0.28 + normX;
        targetRotX = 0.24 + normY;
      });

      window.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.ui-overlay')) return;
        isDragging = true;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const deltaX = (e.clientX - prevPointerX) * 0.005;
        const deltaY = (e.clientY - prevPointerY) * 0.005;
        prevPointerX = e.clientX;
        prevPointerY = e.clientY;

        targetRotY += deltaX;
        targetRotX += deltaY;
      });

      window.addEventListener('pointerup', () => { isDragging = false; });
      window.addEventListener('pointercancel', () => { isDragging = false; });

      // Device Gyroscope Support for Mobile
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
        window.addEventListener('deviceorientation', (e) => {
          if (isMailOpen || !e.gamma || !e.beta) return;
          targetRotY = -0.22 + (e.gamma / 45) * 0.35;
          targetRotX = 0.18 + ((e.beta - 45) / 45) * 0.25;
        });
      }

      // --- 6. Render Loop with Smooth Spring Interpolation ---
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();

        // Idle Floating & Breathing
        if (!isMailOpen && !isDragging) {
          mailGroup.position.y = Math.sin(t * 1.8) * 0.14;
          mailGroup.position.x = Math.cos(t * 0.9) * 0.06;
          mailGroup.rotation.z = 0.22 + Math.sin(t * 1.2) * 0.02;
          
          mailGroup.rotation.y += (targetRotY - mailGroup.rotation.y) * 0.06;
          mailGroup.rotation.x += (targetRotX - mailGroup.rotation.x) * 0.06;
        } else if (isMailOpen) {
          mailGroup.position.y = Math.sin(t * 1.4) * 0.06 - 0.45; // Nhích xuống một chút để tấm thiệp vươn lên vừa khung hình
        }

        // Heart seal subtle pulse
        const s = 0.42 + Math.sin(t * 3.5) * 0.015;
        heartMesh.scale.set(s, s, s);

        // Ambient floating particles
        heartParticles.forEach(p => {
          p.mesh.position.y = p.baseY + Math.sin(t * 1.5 + p.offset) * 0.25;
          p.mesh.rotation.y += p.rotSpeed;
          p.mesh.rotation.z += p.rotSpeed * 0.7;
        });

        renderer.render(scene, camera);
      }
      animate();

      // --- 7. Window Resize ---
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        // Tối ưu khoảng cách camera cho màn hình điện thoại dọc
        if (window.innerWidth < 600) {
          camera.position.z = 9.8;
        } else {
          camera.position.z = 8.5;
        }
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Kích hoạt khoảng cách chuẩn khi tải trang
      if (window.innerWidth < 600) {
        camera.position.z = 9.8;
      }
    })();
  </script>
</body>
</html>
